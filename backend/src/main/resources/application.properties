# ─── Server ─────────────────────────────────────────────────────────
server.port=8080

# ─── Jackson (JSON date serialization) ───────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

# ─── Neon PostgreSQL Database ────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://ep-icy-base-an85ai5d-pooler.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_mVB0OXb7Dtwx
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ─── JPA / Hibernate ─────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─── JWT ─────────────────────────────────────────────────────────────
jwt.secret=EventManagementSystem2026NeonDBSecretKeyForJWTTokenHS512Algorithm12345678
jwt.expiration=86400000

# ─── CORS ────────────────────────────────────────────────────────────
cors.allowed-origins=http://localhost,http://localhost:3000

# ─── Logging ─────────────────────────────────────────────────────────
logging.level.org.springframework.security=DEBUG
logging.level.com.eventmanagement=DEBUG
