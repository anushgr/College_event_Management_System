apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-backend
  namespace: event-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: event-management-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: event-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: event-management
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
