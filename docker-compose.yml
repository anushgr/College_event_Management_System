version: '3.8'

services:
  # ── Spring Boot Backend ──────────────────────────────────────────────────────
  backend:
    image: event-management-backend:latest
    container_name: event-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8081:8080"
    env_file:
      - .env
    networks:
      - event-network
    restart: unless-stopped

  # ── React Frontend (Nginx) ────────────────────────────────────────────────────
  frontend:
    image: event-management-frontend:latest
    container_name: event-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - event-network
    restart: unless-stopped

networks:
  event-network:
    driver: bridge
